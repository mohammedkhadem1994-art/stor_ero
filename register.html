<body>
  <header class="site-header">
    <a class="brand" href="index.html">
      <span class="brand-mark">P</span>
      <span>Plazavo<small>MARKETPLACE · SELLERS · DELIVERY</small></span>
    </a>
    <nav aria-label="Main"><a href="guide.html">How it works</a><a href="login.html">Sign in</a><a href="index.html">Store</a></nav>
  </header>

  <main class="auth-container">
    <section class="auth-card">
      <span class="eyebrow">JOIN PLAZAVO</span>
      <h1>Create your account</h1>
      <p class="auth-intro">Create a buyer account to get started.</p>

      <form id="register-form">
        <label for="register-email">Email address</label>
        <input id="register-email" type="email" autocomplete="email" required>

        <label for="register-password">Create password</label>
        <input id="register-password" type="password" minlength="8" autocomplete="new-password" required>
        <p class="field-help">Use at least 8 characters for this prototype.</p>

        <label for="register-confirm">Confirm password</label>
        <input id="register-confirm" type="password" minlength="8" autocomplete="new-password" required>

        <div id="register-kyc"></div>
        <button class="button button-teal auth-submit" type="submit">Create account</button>
        <p id="register-message" class="form-message" role="status"></p>
      </form>

      <p class="auth-switch">Already registered? <a href="login.html">Sign in</a></p>
      <p class="auth-back"><a href="index.html">← Return to the store</a></p>
    </section>
  </main>

  <footer class="site-footer">
    <p>© <span data-year></span> Plazavo</p>
    <a class="footer-contact" href="mailto:contact@your-domain.example">✉ contact@your-domain.example</a> <span class="footer-contact">📍 Europe</span>
  </footer>
</body>
